<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f7f4">
<link rel="manifest" href="/manifest.json">
<title>課後 | 115.06.06 初階重症學術研討會</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Times New Roman","Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif;background:#f8f7f4;color:#3a3a3a;padding:20px 6px 100px;max-width:630px;margin:0 auto}
.header{text-align:center;margin-bottom:28px}
.header .org{font-size:14px;color:#aaa;letter-spacing:1px;margin-bottom:8px}
.header h1{font-size:22px;font-weight:bold;color:#2e2e2e;line-height:1.7;margin-bottom:10px}
.phase-pill{display:inline-block;font-size:14px;font-weight:bold;color:#b94a00;background:#fde8d8;border:1px solid #f5c9a8;padding:4px 14px;border-radius:20px}
.section-title{font-size:13px;font-weight:bold;color:#aaa;letter-spacing:1.5px;text-transform:uppercase;margin:28px 0 12px}
.item{background:white;border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;border:1px solid #ebebeb}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.item-name{font-size:19px;font-weight:bold;color:#2a2a2a}
.badge{font-size:13px;font-weight:bold;padding:3px 9px;border-radius:20px;white-space:nowrap;margin-left:8px}
.badge-all{background:#eaf5ee;color:#3d8c5e}
.badge-some{background:#f3eef8;color:#7e4fa0}
.note{font-size:15px;color:#666;line-height:1.85;margin-bottom:14px;padding:10px 12px;background:#fafaf7;border-radius:8px;border-left:3px solid #d8e8cf}
.note .em{color:#c0392b;font-weight:bold}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:10px;font-size:17px;font-weight:bold;text-decoration:none}
.btn:active{opacity:.85}
.btn-orange{background:#e07a3a;color:white}
.btn-lavender{background:#9c6db5;color:white}
.btn-hint{text-align:center;font-size:12px;color:#aaa;margin-top:7px}

/* ── 回來提示 Toast ── */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#e07a3a;color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:bold;z-index:999;transition:transform 0.4s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── 底部書籤橫幅 ── */
#bookmark-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e5e5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:998;box-shadow:0 -2px 12px rgba(0,0,0,0.07)}
#bookmark-bar.hidden{display:none}
.bk-text{font-size:13px;color:#444;line-height:1.5}
.bk-text strong{color:#b94a00}
.bk-btn{font-size:13px;font-weight:bold;color:white;background:#e07a3a;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;margin-left:12px}
.bk-close{font-size:18px;color:#aaa;background:none;border:none;cursor:pointer;padding:0 4px;margin-left:8px}
</style>
</head>
<body>

<!-- 回來提示 -->
<div id="toast">✅ 歡迎回來！可繼續填寫下一項目</div>

<!-- 底部書籤橫幅 -->
<div id="bookmark-bar">
  <div class="bk-text">📌 <strong>加入書籤</strong>，不用重新掃QR CODE</div>
  <div style="display:flex;align-items:center">
    <button class="bk-btn" onclick="addBookmark()">加入書籤</button>
    <button class="bk-close" onclick="dismissBar()" aria-label="關閉">×</button>
  </div>
</div>

<div class="header">
  <div class="org">台灣呼吸治療學會</div>
  <h1>115.06.06<br>初階重症學術研討會</h1>
  <span class="phase-pill">課後填寫</span>
</div>

<div class="section-title">01 · 課後滿意度調查</div>
<div class="item">
  <div class="item-top">
    <span class="item-name">滿意度調查</span>
    <span class="badge badge-all">全員必填</span>
  </div>
  <div class="note">
    請於課程結束後填寫，謝謝您！<br>
    <span class="em">※ 簽退請出示滿意度填寫完成畫面 ※</span>
  </div>
  <a class="btn btn-orange" href="https://reurl.cc/qpj3rn" target="_blank" rel="noopener">前往填寫滿意度調查 →</a>
  <p class="btn-hint">填寫完畢後切換回此頁即可</p>
</div>

<div class="section-title">02 · 後測</div>
<div class="item">
  <div class="item-top">
    <span class="item-name">學後測驗</span>
    <span class="badge badge-some">部分學員填寫</span>
  </div>
  <div class="note">
    <span class="em">※ 取得證書資格：後測需及格 ※</span><br>
    非於考試期間作答不計分
  </div>
  <a class="btn btn-lavender" href="https://reurl.cc/18AvnD" target="_blank" rel="noopener">前往填寫後測 →</a>
  <p class="btn-hint">填寫完畢後切換回此頁即可</p>
</div>

<script>
// 書籤橫幅
if(sessionStorage.getItem('bk_dismissed')){
  document.getElementById('bookmark-bar').classList.add('hidden');
}
function dismissBar(){
  document.getElementById('bookmark-bar').classList.add('hidden');
  sessionStorage.setItem('bk_dismissed','1');
}
function addBookmark(){
  if(navigator.share){
    navigator.share({title:document.title,url:location.href});
  } else {
    alert('請按 Ctrl+D（電腦）或使用瀏覽器選單「加入書籤／加入主畫面」');
  }
  dismissBar();
}

// 回來偵測
var _left=false;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ _left=true; }
  else if(_left){
    _left=false;
    var t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); },3500);
  }
});
</script>
</body>
</html>
